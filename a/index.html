<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="format-detection" content="telephone=no">
<title>消化内镜 ESD 术后注意事项清单</title>
<style>
:root{--ink:#111;--sub:#5c5c5c;--line:#e2e2e2;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.78 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;padding-bottom:36px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.mast{background:#fff;border-bottom:2px solid #111;padding:24px 0 18px}
.kicker{font-size:12px;letter-spacing:.18em;color:#7a7a7a;margin:0 0 9px;font-weight:600}
.mast h1{margin:0;font-size:23px;line-height:1.42;font-weight:800;letter-spacing:.01em;color:#111}
.lede{margin:11px 0 0;font-size:13.5px;line-height:1.7;color:#5c5c5c}
.lede strong{color:#111;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:14px 0;padding:2px 0 10px}
.card h2{display:flex;align-items:center;gap:9px;margin:0;padding:16px 16px 2px;font-size:17.5px;font-weight:800;letter-spacing:.01em}
.num{flex:none;min-width:24px;height:24px;padding:0 3px;border-radius:6px;background:#111;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sect-sub{margin:15px 16px 2px;font-size:14.5px;font-weight:700;color:#111}
.note{margin:5px 16px 6px;font-size:14px;line-height:1.72;color:#5c5c5c}
.item{display:flex;gap:11px;align-items:flex-start;margin:0;padding:8px 16px;font-size:15.5px;line-height:1.75;cursor:pointer}
.item input{appearance:none;-webkit-appearance:none;flex:none;width:19px;height:19px;margin:4px 0 0;border:1.6px solid #111;border-radius:4px;background:#fff;position:relative;transition:background .12s}
.item input:checked{background:#111}
.item input:checked::after{content:"";position:absolute;left:6px;top:1.5px;width:5px;height:10px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.item input:checked+span{color:#9a9a9a}
.card.danger{background:#111;border-color:#111;color:#fff}
.card.danger h2{color:#fff}
.card.danger .num{background:#fff;color:#111}
.card.danger .note{color:#bfbfbf}
.card.danger .item input{border-color:#fff;background:#111}
.card.danger .item input:checked{background:#fff;border-color:#fff}
.card.danger .item input:checked::after{border-color:#111}
.card.danger .item input:checked+span{color:#8f8f8f}
.principle{margin:16px 0 8px;padding:18px;border-radius:var(--r);background:#111;color:#fff}
.principle h3{margin:0 0 7px;font-size:12px;letter-spacing:.2em;opacity:.7;font-weight:600}
.principle p{margin:0;font-size:16px;line-height:1.8;font-weight:600}
.foot{margin:24px auto 10px;font-size:12.5px;line-height:1.85;color:#8a8a8a;text-align:center}
.foot b{color:#5c5c5c;font-weight:600}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <p class="kicker">患者版 · 术后宣教</p>
    <h1>消化内镜 ESD 术后<br>注意事项清单</h1>
    <p class="lede">本清单适用于<strong>一般情况</strong>。具体禁食、用药和复查时间，应以<strong>术者医嘱</strong>及<strong>病变部位、切除范围、病理结果</strong>为准。</p>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <h2><span class="num">一</span>住院观察期间</h2>

    <p class="sect-sub">1. 饮食</p>
    <label class="item"><input type="checkbox"><span>严格按照医嘱禁食、禁饮，不自行提前进食。</span></label>
    <label class="item"><input type="checkbox"><span>恢复进食后，通常由饮水或清流质逐步过渡至流质、半流质、软食。</span></label>
    <label class="item"><input type="checkbox"><span>进食后若出现明显腹痛、呕血、黑便、便血或呕吐，应立即停止进食并报告医护人员。</span></label>
    <label class="item"><input type="checkbox"><span>食管或胃 ESD 后避免过热、辛辣、粗糙、坚硬食物。</span></label>
    <label class="item"><input type="checkbox"><span>结直肠 ESD 后按医嘱选择少渣、易消化饮食，避免生冷及刺激性食物。</span></label>

    <p class="sect-sub">2. 症状观察</p>
    <label class="item"><input type="checkbox"><span>观察腹痛、胸痛、腹胀、恶心、呕吐等情况。</span></label>
    <label class="item"><input type="checkbox"><span>监测体温、心率、血压及血氧。</span></label>
    <label class="item"><input type="checkbox"><span>注意有无呕血、咖啡色物、黑便、鲜红色便血。</span></label>
    <label class="item"><input type="checkbox"><span>注意有无持续发热、寒战、呼吸困难或吞咽明显加重。</span></label>
    <label class="item"><input type="checkbox"><span>观察腹部是否进行性膨隆、压痛或肌紧张。</span></label>

    <p class="sect-sub">3. 活动</p>
    <label class="item"><input type="checkbox"><span>术后当天卧床或减少活动，起床时动作缓慢。</span></label>
    <label class="item"><input type="checkbox"><span>症状稳定后逐步下床活动，避免剧烈运动、负重及用力排便。</span></label>
    <label class="item"><input type="checkbox"><span>出院早期避免长途奔波和过度劳累。</span></label>
  </section>

  <section class="card">
    <h2><span class="num">二</span>用药注意事项</h2>
    <label class="item"><input type="checkbox"><span>按医嘱使用质子泵抑制剂等抑酸药物，勿自行停药。</span></label>
    <label class="item"><input type="checkbox"><span>是否使用黏膜保护剂、止血药或抗菌药，遵循术者方案。</span></label>
    <label class="item"><input type="checkbox"><span>抗凝药、抗血小板药及相关保健品的停用和恢复时间，必须由主管医生决定。</span></label>
    <label class="item"><input type="checkbox"><span>未经医生同意，避免使用阿司匹林、布洛芬等可能增加出血风险的药物。</span></label>
    <label class="item"><input type="checkbox"><span>出现皮疹、明显腹泻、头晕或其他药物不良反应，应及时咨询医生。</span></label>
  </section>

  <section class="card">
    <h2><span class="num">三</span>出院后的生活管理</h2>
    <label class="item"><input type="checkbox"><span>饮食清淡、少量多餐，逐步恢复正常饮食。</span></label>
    <label class="item"><input type="checkbox"><span>暂停饮酒、吸烟及辛辣刺激性饮食。</span></label>
    <label class="item"><input type="checkbox"><span>保持大便通畅，避免用力排便。</span></label>
    <label class="item"><input type="checkbox"><span>术后短期内避免剧烈运动、熬夜和重体力劳动。</span></label>
    <label class="item"><input type="checkbox"><span>不自行进行胃肠镜、理疗或服用偏方药物。</span></label>
    <label class="item"><input type="checkbox"><span>妥善保存内镜报告、病理报告及出院记录。</span></label>
  </section>

  <section class="card danger">
    <h2><span class="num">四</span>必须立即就医的情况</h2>
    <p class="note">出现以下任何情况，应立即联系医院或前往急诊：</p>
    <label class="item"><input type="checkbox"><span>呕血、黑便或持续鲜红色便血；</span></label>
    <label class="item"><input type="checkbox"><span>头晕、心慌、面色苍白、出冷汗或接近晕厥；</span></label>
    <label class="item"><input type="checkbox"><span>腹痛或胸痛持续加重，伴腹胀、板状腹；</span></label>
    <label class="item"><input type="checkbox"><span>持续高热、寒战；</span></label>
    <label class="item"><input type="checkbox"><span>反复呕吐、不能进食或饮水；</span></label>
    <label class="item"><input type="checkbox"><span>呼吸困难、吞咽明显困难；</span></label>
    <label class="item"><input type="checkbox"><span>排便、排气明显减少并伴腹胀加重。</span></label>
  </section>

  <section class="card">
    <h2><span class="num">五</span>复诊与病理随访</h2>
    <label class="item"><input type="checkbox"><span>按约定时间复诊，查看完整病理结果。</span></label>
    <label class="item"><input type="checkbox"><span>根据病理结果确认是否达到治愈性切除标准。</span></label>
    <label class="item"><input type="checkbox"><span>需要追加手术或进一步治疗时，按医嘱及时就诊。</span></label>
    <label class="item"><input type="checkbox"><span>按计划复查胃镜、肠镜或影像学检查。</span></label>
    <label class="item"><input type="checkbox"><span>食管 ESD 患者应特别关注吞咽困难及狭窄预防。</span></label>
    <label class="item"><input type="checkbox"><span>大范围胃 ESD 患者应关注迟发性出血、贫血及营养状况。</span></label>
    <label class="item"><input type="checkbox"><span>结直肠 ESD 患者应关注迟发性出血及排便情况。</span></label>
  </section>

  <section class="principle">
    <h3>核心原则</h3>
    <p>严格遵守饮食和用药医嘱，避免剧烈活动，警惕迟发性出血和穿孔，按时完成病理及内镜随访。</p>
  </section>

</main>

<footer class="wrap foot">
  <p><b>本页为健康宣教材料，不能替代医生的诊疗意见。</b><br>如有不适请及时联系您的诊疗医生或就近就医。</p>
</footer>

</body>
</html>
