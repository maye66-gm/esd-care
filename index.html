<!doctype html>
<html lang="zh-CN">
<head>

<title>ESD 术后宣教 · 对比预览</title>
<style>
:root{--line:#e2e2e2;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:26px 16px}
.box{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:6px 0 4px;font-weight:800;line-height:1.5}
.tip{font-size:13px;color:#5c5c5c;margin:0 0 18px;line-height:1.7}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
a.card b{display:block;font-size:16px;color:#111;margin:0 0 3px}
a.card span{font-size:13.5px;color:#5c5c5c;line-height:1.65}
a.card:active{background:#f7f7f7}
.warn{margin-top:18px;font-size:12.5px;color:#8a8a8a;line-height:1.8;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>ESD 术后宣教 · 两个版本对比预览</h1>
  <p class="tip">本页仅供医生对比查看。发给患者时，请直接使用两个版本的独立链接或二维码。</p>
  <a class="card" href="./a/"><b>版本 A · 原文清单</b><span>内容与你提供的原文完全一致，仅做手机排版。</span></a>
  <a class="card" href="./b/"><b>版本 B · 完善版</b><span>在原文基础上补充恢复时间轴、饮食示例、病理四要素、按部位要点、常见问题。</span></a>
  <p class="warn">本材料为健康宣教用途，不替代医生的诊疗意见。</p>
</div>

</html>
