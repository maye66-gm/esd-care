<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESD 术后宣教 · 对比预览</title>
<style>
:root{--ink:#18212a;--sub:#5c6874;--bg:#f4f6f8;--brand:#0f766e;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px 14px}
.box{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:6px 0 4px}
.tip{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.7}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:var(--r);padding:16px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.05),0 12px 28px -22px rgba(16,24,40,.5)}
a.card b{display:block;font-size:16px;color:var(--brand);margin:0 0 3px}
a.card span{font-size:13.5px;color:var(--sub);line-height:1.65}
.warn{margin-top:18px;font-size:12.5px;color:#8b97a3;line-height:1.8;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>ESD 术后宣教 · 两个版本对比预览</h1>
  <p class="tip">本页仅供医生对比查看。发给患者时，请直接使用两个版本的独立链接或二维码。</p>
  <a class="card" href="./a/"><b>版本 A · 原文清单</b><span>内容与你提供的原文完全一致，仅做手机排版。</span></a>
  <a class="card" href="./b/"><b>版本 B · 完善版</b><span>在原文基础上补充恢复时间轴、饮食示例、病理四要素、按部位要点、常见问题。</span></a>
  <p class="warn">本材料为健康宣教用途，不替代医生的诊疗意见。</p>
</div>
</body>
</html>
